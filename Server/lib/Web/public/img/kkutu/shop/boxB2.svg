<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="24 24 208 208" role="img" aria-labelledby="title desc">
	<title id="title">Rare emblem box</title>
	<desc id="desc">An orange and gold emblem box with a red bow and a polished shield clasp.</desc>
	<defs>
		<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffc15b"/>
			<stop offset="0.48" stop-color="#ff9933"/>
			<stop offset="1" stop-color="#e96518"/>
		</linearGradient>
		<linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe96a"/>
			<stop offset="0.5" stop-color="#ffcc00"/>
			<stop offset="1" stop-color="#f09200"/>
		</linearGradient>
		<linearGradient id="bow" x1="0" y1="0" x2="0.8" y2="1">
			<stop offset="0" stop-color="#ff7951"/>
			<stop offset="0.5" stop-color="#ff4800"/>
			<stop offset="1" stop-color="#cb2f00"/>
		</linearGradient>
		<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.58" stop-color="#f6f6f6"/>
			<stop offset="1" stop-color="#dcdfe5"/>
		</linearGradient>
		<linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fff6a5"/>
			<stop offset="0.5" stop-color="#ffd52e"/>
			<stop offset="1" stop-color="#ff8b00"/>
		</linearGradient>
	</defs>

	<!-- Bow: kept entirely above the lid seam so it lifts with the lid. -->
	<path d="M124 73C105 58 100 35 75 35C55 35 47 50 54 65C63 82 94 84 124 78Z" fill="url(#bow)" stroke="#6b2b12" stroke-width="8" stroke-linejoin="round"/>
	<path d="M132 73C151 58 156 35 181 35C201 35 209 50 202 65C193 82 162 84 132 78Z" fill="url(#bow)" stroke="#6b2b12" stroke-width="8" stroke-linejoin="round"/>
	<path d="M62 59C72 47 93 51 111 69C91 65 75 66 62 59Z" fill="#ffad8e" opacity="0.58"/>
	<path d="M194 59C184 47 163 51 145 69C165 65 181 66 194 59Z" fill="#ffad8e" opacity="0.58"/>

	<!-- Chest base. -->
	<path d="M48 108H208V207Q208 220 195 220H61Q48 220 48 207Z" fill="url(#body)" stroke="#6b2b12" stroke-width="8" stroke-linejoin="round"/>
	<path d="M52 113H68V204Q68 212 76 216H61Q52 216 52 207Z" fill="#ffce72" opacity="0.58"/>
	<path d="M188 112H204V207Q204 216 195 216H181Q188 211 188 201Z" fill="#b94210" opacity="0.32"/>
	<path d="M53 196H203V207Q203 215 194 215H62Q53 215 53 207Z" fill="#be4812" opacity="0.42"/>
	<path d="M106 109H150V184L128 203L106 184Z" fill="url(#ribbon)" stroke="#d8b56d" stroke-width="5" stroke-linejoin="round"/>
	<path d="M65 137H81" fill="none" stroke="#ffe0a0" stroke-width="7" stroke-linecap="round"/>
	<path d="M65 183H81" fill="none" stroke="#ffe0a0" stroke-width="7" stroke-linecap="round"/>
	<path d="M175 137H191" fill="none" stroke="#a83e0f" stroke-width="7" stroke-linecap="round" opacity="0.46"/>
	<path d="M175 183H191" fill="none" stroke="#a83e0f" stroke-width="7" stroke-linecap="round" opacity="0.46"/>

	<!-- Lid and its top bevel. The lower edge sits at the animation's 46% split. -->
	<path d="M36 77L50 64H206L220 77V117H36Z" fill="url(#lid)" stroke="#6b2b12" stroke-width="8" stroke-linejoin="round"/>
	<path d="M43 77L53 69H203L213 77Z" fill="#fff3a3" opacity="0.72"/>
	<path d="M40 101H216V113H40Z" fill="#db7800" opacity="0.32"/>
	<path d="M106 65H150V117H106Z" fill="url(#ribbon)" stroke="#d8b56d" stroke-width="5"/>
	<path d="M113 69H126V113H113Z" fill="#ffffff" opacity="0.45"/>

	<!-- Bow knot and rare-tier shield clasp. -->
	<path d="M107 57Q107 48 116 46H140Q149 48 149 57V75Q149 84 140 86H116Q107 84 107 75Z" fill="url(#bow)" stroke="#6b2b12" stroke-width="8"/>
	<path d="M116 54H139" fill="none" stroke="#ffb09a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
	<path d="M100 133Q100 126 107 126H149Q156 126 156 133V158Q156 177 128 190Q100 177 100 158Z" fill="url(#ribbon)" stroke="#6b2b12" stroke-width="7" stroke-linejoin="round"/>
	<path d="M128 137L140 147L136 163L128 171L120 163L116 147Z" fill="url(#gem)" stroke="#b45100" stroke-width="5" stroke-linejoin="round"/>
	<path d="M122 146L128 142L132 147L126 153Z" fill="#ffffff" opacity="0.72"/>
</svg>
